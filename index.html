        // ==========================================
        // ΕΚΔΟΣΗ ΕΦΑΡΜΟΓΗΣ - ΑΛΛΑΞΤΕ ΤΗΝ ΕΔΩ
        const APP_VERSION = "v1.3.0";
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            const numberInput = document.getElementById('numberInput');
            const calculateBtn = document.getElementById('calculateBtn');
            const stepsContainer = document.getElementById('stepsContainer');
            const resultContainer = document.getElementById('resultContainer');
            const exportActions = document.getElementById('exportActions');
            const copyTextBtn = document.getElementById('copyTextBtn');
            const copyImageBtn = document.getElementById('copyImageBtn');

            const infoBtn = document.getElementById('infoBtn');
            const infoModal = document.getElementById('infoModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const appVersionBadge = document.getElementById('appVersionBadge');

            appVersionBadge.textContent = APP_VERSION;

            let lastCalculation = null;
            const copyTimers = new WeakMap();

            // Modal interactions
            function openModal() {
                infoModal.classList.add('open');
                infoModal.setAttribute('aria-hidden', 'false');
                closeModalBtn.focus();
            }

            function closeModal() {
                infoModal.classList.remove('open');
                infoModal.setAttribute('aria-hidden', 'true');
                infoBtn.focus();
            }

            infoBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            infoModal.addEventListener('click', (e) => {
                if (e.target === infoModal) {
                    closeModal();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && infoModal.classList.contains('open')) {
                    closeModal();
                }
            });

            // Calculation interactions
            calculateBtn.addEventListener('click', handleCalculation);
            numberInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    handleCalculation();
                }
            });

            copyTextBtn.addEventListener('click', handleCopyText);
            copyImageBtn.addEventListener('click', handleCopyImage);

            function handleCalculation() {
                stepsContainer.innerHTML = '';
                resultContainer.innerHTML = '';
                resultContainer.classList.remove('error');
                exportActions.classList.remove('visible');
                lastCalculation = null;

                const n = parseInt(numberInput.value, 10);

                if (isNaN(n) || n <= 1) {
                    displayError("Παρακαλώ εισάγετε έναν ακέραιο αριθμό μεγαλύτερο του 1.");
                    return;
                }

                const { steps, factors } = calculateFactorization(n);
                const sortedBases = Object.keys(factors).sort((a, b) => a - b);
                const isPrime = sortedBases.length === 1 && Number(sortedBases[0]) === n && factors[sortedBases[0]] === 1;

                lastCalculation = {
                    originalNumber: n,
                    steps,
                    factors,
                    sortedBases,
                    isPrime
                };

                displaySteps(steps);
                displayResult(factors, n);
                exportActions.classList.add('visible');
            }

            function calculateFactorization(num) {
                let n = num;
                const steps = [];
                const factors = {};
                let divisor = 2;

                while (n > 1) {
                    if (n % divisor === 0) {
                        steps.push({ number: n, divisor: divisor });
                        factors[divisor] = (factors[divisor] || 0) + 1;
                        n = n / divisor;
                    } else {
                        if (divisor === 2) {
                            divisor = 3;
                        } else {
                            divisor += 2;
                        }

                        if (divisor * divisor > n && n > 1) {
                            steps.push({ number: n, divisor: n });
                            factors[n] = (factors[n] || 0) + 1;
                            n = 1;
                        }
                    }
                }

                if (steps.length > 0 && steps[steps.length - 1].number !== 1) {
                    steps.push({ number: 1, divisor: '' });
                }

                return { steps, factors };
            }

            function formatNumber(value) {
                if (value === '' || value === null || value === undefined) return '';
                return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            }

            function displaySteps(steps) {
                const table = document.createElement('table');
                table.className = 'steps-table';
                const tbody = document.createElement('tbody');

                steps.forEach(step => {
                    const tr = document.createElement('tr');
                    const tdNum = document.createElement('td');
                    tdNum.textContent = formatNumber(step.number);
                    const tdDiv = document.createElement('td');
                    tdDiv.textContent = step.divisor !== '' ? formatNumber(step.divisor) : '';

                    tr.appendChild(tdNum);
                    tr.appendChild(tdDiv);
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                stepsContainer.appendChild(table);
            }

            function displayResult(factors, originalNumber) {
                let resultParts = [];
                const sortedBases = Object.keys(factors).sort((a, b) => a - b);

                for (const base of sortedBases) {
                    const exponent = factors[base];
                    const formattedBase = formatNumber(base);
                    if (exponent === 1) {
                        resultParts.push(formattedBase);
                    } else {
                        resultParts.push(`${formattedBase}<sup>${exponent}</sup>`);
                    }
                }

                const formattedOriginal = formatNumber(originalNumber);
                const isPrime = sortedBases.length === 1 && Number(sortedBases[0]) === originalNumber && factors[sortedBases[0]] === 1;

                if (isPrime) {
                    resultContainer.innerHTML = `${formattedOriginal} = ${resultParts[0]} <br><strong>(Ο αριθμός είναι πρώτος)</strong>`;
                } else {
                    resultContainer.innerHTML = `${formattedOriginal} = ${resultParts.join(' &middot; ')}`;
                }
            }

            function displayError(message) {
                resultContainer.innerHTML = message;
                resultContainer.classList.add('error');
                exportActions.classList.remove('visible');
                lastCalculation = null;
            }

            function toUnicodeSuperscript(value) {
                const supMap = {
                    '0': '⁰',
                    '1': '¹',
                    '2': '²',
                    '3': '³',
                    '4': '⁴',
                    '5': '⁵',
                    '6': '⁶',
                    '7': '⁷',
                    '8': '⁸',
                    '9': '⁹'
                };
                return String(value).split('').map(ch => supMap[ch] || ch).join('');
            }

            function buildExportTextPayloads(calc) {
                const { originalNumber, steps, factors, sortedBases, isPrime } = calc;
                const formattedOriginal = formatNumber(originalNumber);

                // Plain Text (ASCII aligned with spaces + Unicode superscripts)
                const maxLeftChars = Math.max(...steps.map(s => formatNumber(s.number).length));
                const maxRightChars = Math.max(1, ...steps.map(s => s.divisor !== '' ? formatNumber(s.divisor).length : 0));

                const plainLines = steps.map(step => {
                    const left = formatNumber(step.number).padStart(maxLeftChars, ' ');
                    if (step.divisor !== '') {
                        return `${left} | ${formatNumber(step.divisor)}`;
                    }
                    return `${left} |`;
                });

                const plainFactorParts = sortedBases.map(base => {
                    const exp = factors[base];
                    const formattedBase = formatNumber(base);
                    return exp === 1 ? `${formattedBase}` : `${formattedBase}${toUnicodeSuperscript(exp)}`;
                });

                let plainResultLine = `${formattedOriginal} = ${plainFactorParts.join(' · ')}`;
                if (isPrime) {
                    plainResultLine += `\n(Ο αριθμός είναι πρώτος)`;
                }

                const plainText = `${plainLines.join('\n')}\n\n${plainResultLine}`;

                // HTML / Rich Text (LibreOffice Writer & MS Word compatible)
                const monoFont = "'DejaVu Sans Mono', 'Courier New', monospace";
                const leftColPx = Math.max(32, Math.ceil(maxLeftChars * 9.5 + 18));
                const rightColPx = Math.max(28, Math.ceil(maxRightChars * 9.5 + 18));
                const tableWidthPx = leftColPx + rightColPx;

                const htmlRows = steps.map(step => {
                    const numCell = formatNumber(step.number);
                    const divCell = step.divisor !== '' ? formatNumber(step.divisor) : '&nbsp;';
                    return (
                        `<tr>` +
                        `<td width="${leftColPx}" nowrap align="right" style="width: ${leftColPx}px; white-space: nowrap; font-family: ${monoFont}; font-size: 11pt; text-align: right; padding: 3px 8px; border-right: 2px solid #333333; color: #333333;">${numCell}</td>` +
                        `<td width="${rightColPx}" nowrap align="left" style="width: ${rightColPx}px; white-space: nowrap; font-family: ${monoFont}; font-size: 11pt; text-align: left; padding: 3px 8px; color: #333333;">${divCell}</td>` +
                        `</tr>`
                    );
                }).join('');

                // Clean bare <sup> tags ensure LibreOffice Writer & MS Word apply native superscript formatting
                const htmlFactorParts = sortedBases.map(base => {
                    const exp = factors[base];
                    const formattedBase = formatNumber(base);
                    return exp === 1 ? `${formattedBase}` : `${formattedBase}<sup>${exp}</sup>`;
                });

                const htmlPrimeNote = isPrime ? `<br><strong>(Ο αριθμός είναι πρώτος)</strong>` : '';
                const htmlContent =
                    '<!DOCTYPE html>' +
                    '<' + 'html><' + 'head><meta charset="UTF-8"><' + '/head>' +
                    '<' + `body style="font-family: ${monoFont}; color: #333333;">` +
                    `<table width="${tableWidthPx}" cellspacing="0" cellpadding="0" style="width: ${tableWidthPx}px; border-collapse: collapse; font-family: ${monoFont}; margin-bottom: 12px;">` +
                    `<tbody>${htmlRows}</tbody>` +
                    `</table>` +
                    `<p style="font-family: ${monoFont}; font-size: 11pt; font-weight: bold; color: #004085; margin: 10px 0 0 0;">` +
                    `${formattedOriginal} = ${htmlFactorParts.join(' &middot; ')}${htmlPrimeNote}` +
                    `</p>` +
                    '<' + '/body><' + '/html>';

                return { plainText, htmlContent };
            }

            async function handleCopyText() {
                if (!lastCalculation) return;
                const { plainText, htmlContent } = buildExportTextPayloads(lastCalculation);

                try {
                    if (typeof ClipboardItem !== 'undefined' && navigator.clipboard && navigator.clipboard.write) {
                        const item = new ClipboardItem({
                            'text/html': new Blob([htmlContent], { type: 'text/html' }),
                            'text/plain': new Blob([plainText], { type: 'text/plain' })
                        });
                        await navigator.clipboard.write([item]);
                    } else if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(plainText);
                    } else {
                        fallbackLegacyCopyText(plainText);
                    }
                    showButtonFeedback(copyTextBtn, 'Αντιγράφηκε! ✓', 'copied');
                } catch (err) {
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(plainText);
                        } else {
                            fallbackLegacyCopyText(plainText);
                        }
                        showButtonFeedback(copyTextBtn, 'Αντιγράφηκε! ✓', 'copied');
                    } catch (fallbackErr) {
                        showButtonFeedback(copyTextBtn, 'Αποτυχία αντιγραφής', 'copy-error');
                    }
                }
            }

            function fallbackLegacyCopyText(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                if (!ok) {
                    throw new Error('execCommand copy failed');
                }
            }

            function renderCalculationToCanvas(calc) {
                const { originalNumber, steps, factors, sortedBases, isPrime } = calc;

                const scale = 2; // Retina / 2x high-DPI clarity
                const outerPadding = 28;
                const rowHeight = 30;
                const colPaddingX = 14;

                const tableFont = '18px "Courier New", Courier, monospace';
                const resultBaseFont = '600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
                const resultSupFont = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
                const primeNoteFont = '700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Measure steps table columns
                ctx.font = tableFont;
                const maxLeftWidth = Math.max(...steps.map(s => ctx.measureText(formatNumber(s.number)).width));
                const maxRightWidth = Math.max(
                    ctx.measureText('2').width,
                    ...steps.map(s => ctx.measureText(s.divisor !== '' ? formatNumber(s.divisor) : '').width)
                );

                const leftColWidth = maxLeftWidth + colPaddingX * 2;
                const rightColWidth = maxRightWidth + colPaddingX * 2;
                const tableWidth = leftColWidth + rightColWidth;
                const tableHeight = steps.length * rowHeight;

                // Build result segments for accurate superscript measurement and drawing
                const resultSegments = [{ text: `${formatNumber(originalNumber)} = `, isSup: false }];
                sortedBases.forEach((base, idx) => {
                    if (idx > 0) {
                        resultSegments.push({ text: ' · ', isSup: false });
                    }
                    resultSegments.push({ text: formatNumber(base), isSup: false });
                    const exp = factors[base];
                    if (exp > 1) {
                        resultSegments.push({ text: String(exp), isSup: true });
                    }
                });

                let resultEqWidth = 0;
                resultSegments.forEach(seg => {
                    ctx.font = seg.isSup ? resultSupFont : resultBaseFont;
                    resultEqWidth += ctx.measureText(seg.text).width;
                });

                let primeLineWidth = 0;
                const primeText = '(Ο αριθμός είναι πρώτος)';
                if (isPrime) {
                    ctx.font = primeNoteFont;
                    primeLineWidth = ctx.measureText(primeText).width;
                }

                const resultBoxPadX = 24;
                const resultBoxPadY = 16;
                const resultLineHeight = 26;
                const resultContentWidth = Math.max(resultEqWidth, primeLineWidth);
                const minResultBoxWidth = Math.max(260, tableWidth);
                const resultBoxWidth = Math.max(minResultBoxWidth, resultContentWidth + resultBoxPadX * 2);
                const resultBoxHeight = resultBoxPadY * 2 + resultLineHeight + (isPrime ? 28 : 0);

                const gapBetweenTableAndBox = 22;
                const contentWidth = Math.max(tableWidth, resultBoxWidth);
                const logicalWidth = Math.ceil(contentWidth + outerPadding * 2);
                const logicalHeight = Math.ceil(outerPadding * 2 + tableHeight + gapBetweenTableAndBox + resultBoxHeight);

                canvas.width = logicalWidth * scale;
                canvas.height = logicalHeight * scale;
                ctx.scale(scale, scale);

                // Solid white background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, logicalWidth, logicalHeight);

                // Draw steps table centered horizontally
                const tableStartX = (logicalWidth - tableWidth) / 2;
                const tableStartY = outerPadding;
                const dividerX = tableStartX + leftColWidth;

                ctx.font = tableFont;
                ctx.fillStyle = '#333333';
                ctx.textBaseline = 'middle';

                steps.forEach((step, index) => {
                    const rowCenterY = tableStartY + index * rowHeight + rowHeight / 2;

                    // Left column (right-aligned)
                    ctx.textAlign = 'right';
                    ctx.fillText(formatNumber(step.number), dividerX - colPaddingX, rowCenterY);

                    // Right column (left-aligned next to divider)
                    if (step.divisor !== '') {
                        ctx.textAlign = 'left';
                        ctx.fillText(formatNumber(step.divisor), dividerX + colPaddingX, rowCenterY);
                    }
                });

                // Vertical divider line
                ctx.beginPath();
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 2;
                ctx.moveTo(dividerX, tableStartY);
                ctx.lineTo(dividerX, tableStartY + tableHeight);
                ctx.stroke();

                // Draw result box
                const boxX = (logicalWidth - resultBoxWidth) / 2;
                const boxY = tableStartY + tableHeight + gapBetweenTableAndBox;
                const radius = 6;

                ctx.beginPath();
                ctx.moveTo(boxX + radius, boxY);
                ctx.lineTo(boxX + resultBoxWidth - radius, boxY);
                ctx.quadraticCurveTo(boxX + resultBoxWidth, boxY, boxX + resultBoxWidth, boxY + radius);
                ctx.lineTo(boxX + resultBoxWidth, boxY + resultBoxHeight - radius);
                ctx.quadraticCurveTo(boxX + resultBoxWidth, boxY + resultBoxHeight, boxX + resultBoxWidth - radius, boxY + resultBoxHeight);
                ctx.lineTo(boxX + radius, boxY + resultBoxHeight);
                ctx.quadraticCurveTo(boxX, boxY + resultBoxHeight, boxX, boxY + resultBoxHeight - radius);
                ctx.lineTo(boxX, boxY + radius);
                ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
                ctx.closePath();

                ctx.fillStyle = '#e6f7ff';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#b3e0ff';
                ctx.stroke();

                // Draw result equation centered inside result box
                ctx.fillStyle = '#004085';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';

                let cursorX = boxX + (resultBoxWidth - resultEqWidth) / 2;
                const eqBaselineY = boxY + resultBoxPadY + 19;

                resultSegments.forEach(seg => {
                    ctx.font = seg.isSup ? resultSupFont : resultBaseFont;
                    const yOffset = seg.isSup ? -7 : 0;
                    ctx.fillText(seg.text, cursorX, eqBaselineY + yOffset);
                    cursorX += ctx.measureText(seg.text).width;
                });

                if (isPrime) {
                    ctx.font = primeNoteFont;
                    ctx.textAlign = 'center';
                    ctx.fillText(primeText, boxX + resultBoxWidth / 2, eqBaselineY + 28);
                }

                return canvas;
            }

            async function handleCopyImage() {
                if (!lastCalculation) return;

                try {
                    if (typeof ClipboardItem === 'undefined' || !navigator.clipboard || !navigator.clipboard.write) {
                        throw new Error('Clipboard image API unavailable');
                    }

                    const canvas = renderCalculationToCanvas(lastCalculation);
                    const blob = await new Promise((resolve, reject) => {
                        canvas.toBlob((resultBlob) => {
                            if (resultBlob) {
                                resolve(resultBlob);
                            } else {
                                reject(new Error('Failed to create PNG blob'));
                            }
                        }, 'image/png');
                    });

                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);

                    showButtonFeedback(copyImageBtn, 'Αντιγράφηκε! ✓', 'copied');
                } catch (err) {
                    showButtonFeedback(copyImageBtn, 'Μη υποστηριζόμενο', 'copy-error');
                }
            }

            function showButtonFeedback(button, tempText, statusClass) {
                const labelSpan = button.querySelector('.btn-label');
                if (!button.dataset.originalLabel) {
                    button.dataset.originalLabel = labelSpan.textContent;
                }

                const existingTimer = copyTimers.get(button);
                if (existingTimer) {
                    clearTimeout(existingTimer);
                }

                button.classList.remove('copied', 'copy-error');
                button.classList.add(statusClass);
                labelSpan.textContent = tempText;

                const timerId = setTimeout(() => {
                    button.classList.remove('copied', 'copy-error');
                    labelSpan.textContent = button.dataset.originalLabel;
                    copyTimers.delete(button);
                }, 2000);

                copyTimers.set(button, timerId);
            }
        });
    </script>
</head>
<body>

        <div class="input-section">

            <input type="number" id="numberInput" placeholder="π.χ. 600">
            <button id="calculateBtn">Υπολογισμός</button>
        </div>

        <div class="output-section">
            <div id="stepsContainer"></div>
            <div id="resultContainer"></div>
            <div id="exportActions" class="export-actions">
                <button type="button" id="copyTextBtn" class="export-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span class="btn-label">Αντιγραφή Κειμένου</span>
                </button>
                <button type="button" id="copyImageBtn" class="export-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span class="btn-label">Αντιγραφή Εικόνας</span>
                </button>
            </div>
        </div>
    </div>

    <div id="infoModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-card">
            <button type="button" id="closeModalBtn" class="modal-close" aria-label="Κλείσιμο">&times;</button>
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">Υπολογιστής Παραγοντοποίησης</h2>

        </div>
